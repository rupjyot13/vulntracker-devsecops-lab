name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SAST - Static Application Security Testing
  # ============================================================
  sast:
    name: SAST - Bandit and Semgrep
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          mkdir -p reports

          bandit -r app \
            -f json \
            -o reports/bandit.json \
            --exit-zero

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            app || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/


  # ============================================================
  # 2. SCA - Software Composition Analysis
  # ============================================================
  sca:
    name: SCA - Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: trivy-fs.json


    # ============================================================
  # 3. IaC - Infrastructure as Code Security
  # ============================================================
  iac:
    name: IaC - Checkov
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source
      # --------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Create reports directory
      # --------------------------------------------------------
      - name: Create reports directory
        run: |
          mkdir -p reports


      # --------------------------------------------------------
      # Install Checkov
      # --------------------------------------------------------
      - name: Install Checkov
        run: |
          pip install checkov


      # --------------------------------------------------------
      # Run Checkov
      # --------------------------------------------------------
      - name: Run Checkov
        run: |
          checkov \
            -d terraform \
            --framework terraform \
            -o json \
            > reports/checkov.json || true


      # --------------------------------------------------------
      # Verify Checkov report
      # --------------------------------------------------------
      - name: Verify Checkov report
        run: |
          echo "Checking Checkov report..."

          if [ -f reports/checkov.json ]; then
            echo "Checkov report created successfully."
            ls -lh reports/checkov.json
          else
            echo "ERROR: Checkov report was not created."
            exit 1
          fi


      # --------------------------------------------------------
      # Show report information
      # --------------------------------------------------------
      - name: Show Checkov report
        run: |
          echo "Checkov report:"
          head -c 1000 reports/checkov.json || true


      # --------------------------------------------------------
      # Upload Checkov report
      # --------------------------------------------------------
      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        with:
          name: iac-report
          path: reports/checkov.json

  # ============================================================
  # 4. Container Build and Security Scan
  # ============================================================
  container:
    name: Container - Build and Trivy Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t vulntracker:ci \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vulntracker:ci
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload container scan report
        uses: actions/upload-artifact@v4
        with:
          name: container-report
          path: trivy-image.json

    # ============================================================
  # 5. Security Gate - Python
  # ============================================================
  security-gate:
    name: Security Gate - Python
    runs-on: ubuntu-latest

    # Security Gate waits for all scanners to finish.
    needs:
      - sast
      - sca
      - iac
      - container

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # Needed because security_gate.py is in the repository.
      # --------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Install Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Download SAST reports
      # --------------------------------------------------------
      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: reports/sast


      # --------------------------------------------------------
      # Download SCA report
      # --------------------------------------------------------
      - name: Download SCA report
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: reports/sca


      # --------------------------------------------------------
      # Download IaC report
      # --------------------------------------------------------
      - name: Download IaC report
        uses: actions/download-artifact@v4
        with:
          name: iac-report
          path: reports/iac


      # --------------------------------------------------------
      # Download Container report
      # --------------------------------------------------------
      - name: Download Container report
        uses: actions/download-artifact@v4
        with:
          name: container-report
          path: reports/container


      # --------------------------------------------------------
      # Show downloaded reports
      # Useful for troubleshooting.
      # --------------------------------------------------------
      - name: List security reports
        run: |
          echo "Security reports downloaded:"
          find reports -type f -name "*.json" -print

      - name: Inspect downloaded report
        run: |
          echo "===== Report files ====="
          find reports -type f -print

          echo ""
          echo "===== File types ====="
          find reports -type f -name "*.json" -exec file {} \;    


      # --------------------------------------------------------
      # Run Python Security Gate
      # --------------------------------------------------------
      - name: Run Security Gate
        run: |
          python scripts/security_gate.py        