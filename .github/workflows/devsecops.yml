name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SAST - Static Application Security Testing
  # ============================================================
  sast:
    name: SAST - Bandit and Semgrep
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          mkdir -p reports

          bandit -r app \
            -f json \
            -o reports/bandit.json \
            --exit-zero

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            app || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/


  # ============================================================
  # 2. SCA - Software Composition Analysis
  # ============================================================
  sca:
    name: SCA - Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: trivy-fs.json


  # ============================================================
  # 3. IaC - Infrastructure as Code Security
  # ============================================================
  iac:
    name: IaC - Checkov
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          output_format: json
          output_file_path: reports/checkov.json
          soft_fail: true

      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        with:
          name: iac-report
          path: reports/checkov.json